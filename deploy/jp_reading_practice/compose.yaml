# docker-compose.yml
services:

  jp-reading-practice-backend:
    image: ghcr.io/tkober/jp-reading-practice-backend:latest
    container_name: jp-reading-practice-backend
    restart: unless-stopped
    env_file:
      - ./env/jp-reading-practice-backend/.env
    networks:
      - jp-reading-practice-net
      - postgres-core-net # external: reach the postgres-core container by name
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      # The backend waits for postgres-core, which is a separate stack and may
      # still be starting. Failed checks should not count during that window.
      start_period: 60s
    # No published port: the frontend's nginx proxies /api over the internal
    # network, so the API is reachable under whatever address serves the UI.

  jp-reading-practice-frontend:
    image: ghcr.io/tkober/jp-reading-practice-frontend:latest
    container_name: jp-reading-practice-frontend
    restart: unless-stopped
    depends_on:
      jp-reading-practice-backend:
        condition: service_healthy
    ports:
      - "8088:80" # only published port: nginx serves the SPA and proxies /api
    networks:
      - jp-reading-practice-net

networks:
  jp-reading-practice-net:
    name: jp-reading-practice-net

  postgres-core-net:
    external: true
