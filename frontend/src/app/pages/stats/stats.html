@if (failed()) {
  <sumi-page title="Stats">
    <sumi-error-state title="Can't reach the server" companion="fukurou" pattern="none">
      Your stats are safe either way.
      <button sumiErrorAction type="button" sumiButton variant="secondary" (click)="reload()">
        Try again
      </button>
    </sumi-error-state>
  </sumi-page>
} @else if (loading()) {
  <sumi-page title="Stats">
    <p>Loading…</p>
  </sumi-page>
} @else if (loadError(); as error) {
  <sumi-page title="Stats">
    <sumi-banner tone="error">{{ error }}</sumi-banner>
  </sumi-page>
} @else {
  <app-stats-screen
    [summary]="summary()"
    [speedSeries]="speedSeries()"
    [helpsSeries]="helpsSeries()"
    [speedByStyle]="speedByStyle()"
    [speedByTopic]="speedByTopic()"
    [problemWords]="problemWords()"
    [stretchLevelSeries]="stretchLevelSeries()"
    [stretchNow]="stretchNow()"
  />
}
