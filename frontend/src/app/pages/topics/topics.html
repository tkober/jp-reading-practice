@if (failed()) {
  <sumi-page title="Topics">
    <sumi-error-state title="Can't reach the server" companion="fukurou" pattern="none">
      Your topics are safe either way.
      <button sumiErrorAction type="button" sumiButton variant="secondary" (click)="reload()">
        Try again
      </button>
    </sumi-error-state>
  </sumi-page>
} @else if (mode() === 'list') {
  @if (loadError(); as error) {
    <sumi-page title="Topics">
      <sumi-banner tone="error">{{ error }}</sumi-banner>
    </sumi-page>
  } @else {
    <app-topics-list-screen
      [topics]="summaries()"
      (newTopic)="openNewTopic()"
      (editTopic)="openTopic($event)"
    />
  }
} @else {
  <app-topic-edit-screen
    [draft]="draft()"
    [showRssFeeds]="showRssFeeds()"
    [isBuiltin]="isBuiltin()"
    [isCustomized]="isCustomized()"
    [canDelete]="canDelete()"
    (nameChange)="setName($event)"
    (glyphChange)="setGlyph($event)"
    (styleChange)="setStyle($event)"
    (promptChange)="setPrompt($event)"
    (rssFeedAdd)="addFeed($event)"
    (rssFeedRemove)="removeFeed($event)"
    (save)="save()"
    (reset)="resetToBuiltin()"
    (delete)="deleteTopic()"
  />
  <div class="topics-editor-footer">
    <a class="back" role="button" tabindex="0" (click)="backToList()" (keydown.enter)="backToList()">
      ← All topics
    </a>
    @if (saveMessage(); as message) {
      <sumi-banner [tone]="saveState() === 'error' ? 'error' : 'success'">{{ message }}</sumi-banner>
    }
  </div>
}
