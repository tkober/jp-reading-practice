@switch (state()) {
  @case ('setup') {
    <app-setup-screen
      [topics]="topics()"
      [selectedTopicId]="selectedTopicId()"
      [length]="length()"
      [readingSpeedCharsPerMinute]="paceCharsPerMinute()"
      [preset]="preset()"
      [unknownKanjiSharePercent]="unknownKanjiSharePercent()"
      [jlptMix]="jlptMix()"
      [style]="style()"
      [adjustOpen]="adjustOpen()"
      [hasOpenAiKey]="hasOpenAiKey()"
      [kanjiTrainerOnline]="kanjiTrainerOnline()"
      (topicSelect)="onTopicSelect($event)"
      (lengthChange)="onLengthChange($event)"
      (presetChange)="onPresetChange($event)"
      (unknownKanjiShareChange)="onUnknownKanjiShareChange($event)"
      (jlptMixChange)="onJlptMixChange($event)"
      (styleChange)="onStyleChange($event)"
      (adjustToggle)="onAdjustToggle()"
      (generate)="onGenerate()"
    />
  }
  @case ('generating') {
    <app-generating-screen [steps]="generationSteps()" />
  }
  @case ('gate') {
    @if (textOut(); as text) {
      <app-gate-screen
        [titleJapanese]="text.title"
        [characterCount]="gateCharacterCount()"
        [estimatedMinutes]="gateEstimatedMinutes()"
        [unknownKanjiPercent]="gateUnknownKanjiPercent()"
        [jlptMix]="gateJlptMix()"
        [kanjiTrainerErrorNote]="text.kanji_trainer_error"
        [materialErrorNote]="text.material_error"
        (start)="onStart()"
      />
    }
  }
  @case ('error') {
    <app-generation-failed-screen
      [message]="errorMessage()"
      (retry)="onRetry()"
      (backToSetup)="onBackToSetup()"
    />
  }
}
