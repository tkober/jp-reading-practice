<div class="grid" role="radiogroup" aria-label="Topic">
  @for (topic of topics(); track topic.id) {
    <button
      type="button"
      class="tile"
      role="radio"
      [attr.aria-checked]="topic.id === selectedId()"
      [class.tile--selected]="topic.id === selectedId()"
      (click)="onSelect(topic.id)"
    >
      <span class="glyph" lang="ja">{{ topic.glyph }}</span>
      <span class="name">{{ topic.name }}</span>
    </button>
  }
  <button
    type="button"
    class="tile tile--surprise"
    role="radio"
    [attr.aria-checked]="surpriseId() === selectedId()"
    [class.tile--selected]="surpriseId() === selectedId()"
    (click)="onSelect(surpriseId())"
  >
    <span class="glyph">✨</span>
    <span class="name">Surprise me</span>
  </button>
</div>
