<div class="grid" role="radiogroup">
  @for (option of options(); track option.id; let index = $index) {
    <button
      type="button"
      class="tile"
      [class.tile--selected]="option.id === selectedId() && !answered()"
      [class.tile--correct]="toneFor(option) === 'correct'"
      [class.tile--wrong]="toneFor(option) === 'wrong'"
      role="radio"
      [attr.aria-checked]="option.id === selectedId()"
      [disabled]="answered()"
      (click)="onSelect(option.id)"
    >
      <span class="letter">{{ letterFor(index) }}</span>
      <span class="text">{{ option.text }}</span>
      @if (toneFor(option) === 'correct') {
        <sumi-icon class="icon" name="check" />
      } @else if (toneFor(option) === 'wrong') {
        <sumi-icon class="icon" name="cross" />
      }
    </button>
  }
</div>
