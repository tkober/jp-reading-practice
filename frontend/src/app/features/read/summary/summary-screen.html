<sumi-page [inkEnd]="false">
  <!--
    `sumi-session-summary`'s own action button is always `variant="primary"`
    (not something this app can override) — so the action that should read
    as primary ("New text") goes there, and "Read again" is this screen's
    own, deliberately secondary, button next to it. Only one ink place on
    this page: the gate's own companion scene, not also one at the page end
    (`[inkEnd]="false"` above), the same way the other apps do it.
  -->
  <sumi-session-gate [showAction]="false" companion="fukurou">
    <sumi-session-summary
      [durationMs]="activeTimeMs()"
      headline="Text complete"
      actionLabel="New text"
      (restart)="newText.emit()"
    >
      <sumi-hanko sumiSummaryArt characters="読了" label="Finished reading" />
      <div sumiSummaryTile label="Speed">{{ speedCharsPerMinute() }} <small>字/min</small></div>
      <div sumiSummaryTile label="Helps">
        {{ helpsPerHundredWords() }} <small>/100 words</small>
      </div>
      <div sumiSummaryTile label="Questions">{{ questionsCorrect() }}/{{ questionsTotal() }}</div>
    </sumi-session-summary>

    @if (stretchNote(); as note) {
      <p class="stretch-note">{{ note }}</p>
    }

    <div class="secondary-action">
      <button type="button" sumiButton variant="secondary" (click)="readAgain.emit()">
        Read again
      </button>
    </div>
  </sumi-session-gate>

  @if (lookedUpWords().length > 0) {
    <sumi-card>
      <h2 sumiCardHeader>Words you looked up</h2>
      <sumi-data-table [columns]="tableColumns" [rows]="tableRows()" />
    </sumi-card>
  }
</sumi-page>
