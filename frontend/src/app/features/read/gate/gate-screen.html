@if (kanjiTrainerErrorNote(); as note) {
  <sumi-banner tone="notice">{{ note }}</sumi-banner>
}
@if (materialErrorNote(); as note) {
  <!-- Say what it means for this text first; the technical reason follows. -->
  <sumi-banner tone="notice"
    >No current news could be loaded, so this is an invented everyday news piece.
    {{ note }}</sumi-banner
  >
}

<sumi-session-gate
  [title]="titleJapanese()"
  [text]="summaryLine()"
  actionLabel="Start reading"
  companion="fukurou"
  (start)="start.emit()"
>
  <!-- No JLPT levels at all (e.g. measured without the Kanji Trainer): an
       empty bar would say nothing, so it is left out. -->
  @if (jlptSegments().length > 0) {
    <sumi-segmented-bar ariaLabel="Measured JLPT mix" [segments]="jlptSegments()" [legend]="true" />
  }
</sumi-session-gate>
