[project]
name = "jp-reading-practice-backend"
version = "0.1.0"
description = "Backend for the Japanese reading practice app: generated texts at the learner's level"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.20.0",
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres]>=4.9",
    # The app talks to Postgres over asyncpg, but the role bootstrap in
    # conftest runs before the event loop exists and needs a sync driver.
    # testcontainers[postgres] does not pull one in.
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the SQLAlchemy engine is created once and
# a per-test loop would leave it bound to a loop that is already closed.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
